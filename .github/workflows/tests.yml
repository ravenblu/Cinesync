name: Python tests
on: [push, pull_request]
jobs:
  unit:
    # Pin an image with published Python 3.9 x64 builds in setup-python.
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        python: ['3.9', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
  macos-desktop:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install '.[desktop,build]'
      - run: python -m unittest discover -s tests -v
        env:
          QT_QPA_PLATFORM: offscreen
      - run: python scripts/build_macos.py
      - run: ditto -c -k --sequesterRsrc --keepParent 'dist/CineSync Bridge.app' 'dist/CineSync-Bridge-macOS.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: cinesync-macos-preview
          path: dist/CineSync-Bridge-macOS.zip
